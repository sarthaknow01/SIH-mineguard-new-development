<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield -->
  <path d="M100 15 L35 50 L35 110 C35 160 100 195 100 195 C100 195 165 160 165 110 L165 50 Z" 
        fill="url(#shieldGrad)" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Inner dark section -->
  <path d="M100 35 L50 65 L50 110 C50 155 100 185 100 185 C100 185 150 155 150 110 L150 65 Z" 
        fill="#1a1a1a"/>
  
  <!-- Yellow background behind miner -->
  <rect x="50" y="65" width="100" height="45" fill="#FFD700" rx="4"/>
  
  <!-- Miner silhouette with hardhat -->
  <g transform="translate(100, 90)">
    <!-- Hardhat -->
    <ellipse cx="0" cy="-15" rx="14" ry="16" fill="#FF8C00" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M-12,-10 Q0,-5 12,-10" fill="#FFD700" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- Head -->
    <circle cx="0" cy="2" r="8" fill="#1a1a1a"/>
    
    <!-- Body -->
    <ellipse cx="0" cy="18" rx="12" ry="14" fill="#FF8C00"/>
    
    <!-- Pickaxe -->
    <line x1="-8" y1="5" x2="-20" y2="-8" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
    <polygon points="-20,-8 -18,-12 -22,-6" fill="#FFD700"/>
  </g>
  
  <!-- Bottom decorative stars and badge -->
  <g transform="translate(100, 155)">
    <!-- Left star -->
    <polygon points="-30,0 -26,-8 -18,-8 -24,-2 -20,6 -30,0" fill="#FFD700"/>
    <!-- Right star -->
    <polygon points="30,0 34,-8 42,-8 36,-2 40,6 30,0" fill="#FFD700"/>
    <!-- Bottom badge circle -->
    <circle cx="0" cy="15" r="10" fill="#FFD700" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Worker symbol in badge -->
    <circle cx="0" cy="11" r="3" fill="#1a1a1a"/>
    <path d="M-3,15 Q0,18 3,15" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="175" font-size="18" font-weight="bold" fill="#FFD700" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="2">MINEGUARD</text>
</svg>