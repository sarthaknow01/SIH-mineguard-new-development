<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B00;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Shield outline -->
  <path d="M100 10 L40 45 L40 100 C40 150 100 190 100 190 C100 190 160 150 160 100 L160 45 Z" 
        fill="url(#orangeGrad)" stroke="#1a1a1a" stroke-width="3"/>
  
  <!-- Dark band -->
  <rect x="45" y="80" width="110" height="35" fill="#1a1a1a" rx="3"/>
  
  <!-- Star 1 -->
  <polygon points="65,95 70,110 85,110 72,120 77,135 65,125 53,135 58,120 45,110 60,110" 
           fill="#FFD700" opacity="0.9"/>
  
  <!-- Star 2 -->
  <polygon points="135,95 140,110 155,110 142,120 147,135 135,125 123,135 128,120 115,110 130,110" 
           fill="#FFD700" opacity="0.9"/>
  
  <!-- Pickaxe and hardhat icon -->
  <g transform="translate(100, 60)">
    <!-- Hardhat dome -->
    <circle cx="0" cy="-8" r="12" fill="#FFD700" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Hardhat visor -->
    <ellipse cx="0" cy="3" rx="15" ry="6" fill="#1a1a1a"/>
    <!-- Pickaxe -->
    <line x1="-8" y1="5" x2="8" y2="20" stroke="#FFD700" stroke-width="2"/>
    <polygon points="8,20 10,18 12,22" fill="#FFD700"/>
  </g>
</svg>